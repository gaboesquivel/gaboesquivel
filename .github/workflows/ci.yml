name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    # One job: lint and build take seconds, less than a second job's setup.
    # No dependency cache: bun install takes under 1s here, less than a cache restore.
    # No paths-ignore: the formatter checks markdown and generate validates content/.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Lint and format check
        run: bun run lint
      - name: Generate, typecheck and build
        run: bun run build
